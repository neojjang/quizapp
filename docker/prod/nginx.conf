# 운영(compose.prod.yml)의 web 컨테이너. 정적 파일은 이미지의 /app/public, PHP는 app 컨테이너(php-fpm)로 넘긴다
server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    # 듣기평가 mp3 업로드(최대 100MB). Cloudflare Free/Pro 요청 본문 한도도 100MB다
    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # 서술형 Python 채점 제한(30초)보다 길게
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
